<!DOCTYPE html>
<html>
<head>
  <title>Retailer Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
  <h2>Log New Delivery Request</h2>
  <form id="requestForm">
    <input type="number" class="form-control mb-2" placeholder="Retailer ID" id="retailerId" required>
    <input type="text" class="form-control mb-2" placeholder="Customer Name" id="customerName" required>
    <input type="text" class="form-control mb-2" placeholder="Item Description" id="item" required>
    <button type="submit" class="btn btn-primary">Submit Request</button>
  </form>
  <div id="response" class="mt-3"></div>

  <script>
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/retailers/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          retailer_id: document.getElementById('retailerId').value,
          customer_name: document.getElementById('customerName').value,
          item: document.getElementById('item').value
        })
      });
      const data = await res.json();
      document.getElementById('response').innerText = "Request logged: " + JSON.stringify(data);
    });
  </script>
</body>
</html>
